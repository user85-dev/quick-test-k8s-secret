substitutions:
  _NAMESPACE: default
  _NAME: app-secret
  _VALUE: ""
  _STATE_BUCKET: ""

steps:
  - id: gen-tfvars
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    dir: secret
    args:
      - scripts/gen-tfvars.sh
    env:
      - NAMESPACE=${_NAMESPACE}
      - NAME=${_NAME}
      - VALUE=${_VALUE}
      - OUT=terraform.tfvars

  - id: terraform-apply
    name: hashicorp/terraform:1.9
    entrypoint: sh
    dir: secret
    args:
      - -c
      - |
        terraform init -input=false \
          -backend-config="bucket=$_STATE_BUCKET" \
          -backend-config="prefix=$_NAME" && \
        terraform apply -input=false -auto-approve

options:
  logging: CLOUD_LOGGING_ONLY